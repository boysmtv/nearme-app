apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 1000

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    uid: tempo
    editable: true
    jsonData:
      tracesToLogsV2:
        datasourceUid: Loki
        filterByTraceID: true
        filterBySpanID: true
      nodeGraph:
        enabled: true
      serviceMap:
        datasourceUid: Prometheus
      lokiSearch:
        datasourceUid: Loki

  - name: AlertManager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    editable: true
    jsonData:
      implementation: prometheus

alerting:
  alertmanagers:
    - name: AlertManager
      uid: alertmanager
      type: alertmanager
      orgId: 1
      isDefault: true
      jsonData:
        implementation: prometheus

users:
  default_org_role: Admin

auth:
  disable_login_form: false

security:
  allow_embedding: true
  cookie_secure: false
  strict_transport_security: false

apiVersion: 1

providers:
  - name: 'DEKAT Dashboards'
    orgId: 1
    folder: 'DEKAT'
    folderUid: 'dekat'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
