name: dekat

services:
  # ──────────────────────── Reverse Proxy ────────────────────────
  caddy:
    image: caddy:2.9-alpine
    container_name: dekat-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    depends_on:
      - web-public
      - web-provider
      - web-admin
      - api-blue
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ──────────────────────── Frontend Apps ────────────────────────
  web-public:
    image: ${REGISTRY:-ghcr.io}/${ORG:-dekat}/web-public:${WEB_PUBLIC_TAG:-latest}
    container_name: dekat-web-public
    restart: unless-stopped
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3

  web-provider:
    image: ${REGISTRY:-ghcr.io}/${ORG:-dekat}/web-provider:${WEB_PROVIDER_TAG:-latest}
    container_name: dekat-web-provider
    restart: unless-stopped
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3

  web-admin:
    image: ${REGISTRY:-ghcr.io}/${ORG:-dekat}/web-admin:${WEB_ADMIN_TAG:-latest}
    container_name: dekat-web-admin
    restart: unless-stopped
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ──────────────────────── API (Blue-Green) ────────────────────────
  api-blue:
    image: ${REGISTRY:-ghcr.io}/${ORG:-dekat}/api:${API_TAG:-latest}
    container_name: dekat-api-blue
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES:-prod}
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://pgbouncer:6432/${POSTGRES_DB:-dekat}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-dekat}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy:4318
      - OTEL_SERVICE_NAME=api-blue
      - JAVA_OPTS=${API_JAVA_OPTS:--Xms512m -Xmx1024m}
    networks:
      - app
      - edge
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  api-green:
    image: ${REGISTRY:-ghcr.io}/${ORG:-dekat}/api:${API_TAG:-latest}
    container_name: dekat-api-green
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES:-prod}
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://pgbouncer:6432/${POSTGRES_DB:-dekat}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-dekat}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy:4318
      - OTEL_SERVICE_NAME=api-green
      - JAVA_OPTS=${API_JAVA_OPTS:--Xms512m -Xmx1024m}
    networks:
      - app
      - edge
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ──────────────────────── Worker ────────────────────────
  worker:
    image: ${REGISTRY:-ghcr.io}/${ORG:-dekat}/worker:${WORKER_TAG:-latest}
    container_name: dekat-worker
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES:-prod}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://pgbouncer:6432/${POSTGRES_DB:-dekat}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-dekat}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy:4318
      - OTEL_SERVICE_NAME=worker
      - JAVA_OPTS=${WORKER_JAVA_OPTS:--Xms512m -Xmx1024m}
    networks:
      - app
      - data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ──────────────────────── Data Layer ────────────────────────
  postgres:
    image: postgres:18.6-alpine
    container_name: dekat-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-dekat}
      - POSTGRES_USER=${POSTGRES_USER:-dekat}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql
      - ../postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dekat} -d ${POSTGRES_DB:-dekat}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:1.24.0
    container_name: dekat-pgbouncer
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-dekat}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dekat}
      - POOL_MODE=transaction
      - DEFAULT_POOL_SIZE=${PGBOUNCER_POOL_SIZE:-20}
      - MAX_CLIENT_CONN=${PGBOUNCER_MAX_CLIENT_CONN:-200}
      - MIN_POOL_SIZE=5
      - RESERVE_POOL_SIZE=5
      - SERVER_TLS_SSLMODE=prefer
      - AUTH_TYPE=md5
    networks:
      - data
      - app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.2-alpine
    container_name: dekat-redis
    restart: unless-stopped
    command: redis-server /etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ../redis/redis.conf:/etc/redis/redis.conf:ro
    networks:
      - data
      - app
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.3.1
    container_name: dekat-kafka
    restart: unless-stopped
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
      - CLUSTER_ID=${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      - KAFKA_NUM_PARTITIONS=${KAFKA_NUM_PARTITIONS:-6}
      - KAFKA_DEFAULT_REPLICATION_FACTOR=1
      - KAFKA_LOG_RETENTION_HOURS=168
      - KAFKA_LOG_SEGMENT_BYTES=1073741824
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5

  object-storage:
    image: minio/minio:latest
    container_name: dekat-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_BROWSER_REDIRECT_URL=${MINIO_BROWSER_URL:-http://localhost:9001}
    volumes:
      - minio_data:/data
    networks:
      - data
      - app
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ──────────────────────── Observability ────────────────────────
  alloy:
    image: grafana/alloy:v1.9.0
    container_name: dekat-alloy
    restart: unless-stopped
    volumes:
      - ../observability/alloy.river:/etc/alloy/config.alloy:ro
    command: run --storage.path=/var/lib/alloy/data --config.file=/etc/alloy/config.alloy
    networks:
      - observability
      - app
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:12345:12345"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:12345/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v3.4.2
    container_name: dekat-prometheus
    restart: unless-stopped
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  loki:
    image: grafana/loki:3.5.0
    container_name: dekat-loki
    restart: unless-stopped
    volumes:
      - ../observability/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 5s
      retries: 3

  tempo:
    image: grafana/tempo:2.7.1
    container_name: dekat-tempo
    restart: unless-stopped
    volumes:
      - ../observability/tempo-config.yml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo
    command: -config.file=/etc/tempo/config.yaml
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3200/ready"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:11.6.0
    container_name: dekat-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3001}
      - GF_INSTALL_PLUGINS=grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ../observability/grafana/provisioning.yml:/etc/grafana/provisioning.yml:ro
    command: >
      --config=/etc/grafana/provisioning.yml
      --homepath=/usr/share/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    networks:
      - observability
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

# ──────────────────────── Networks ────────────────────────
networks:
  edge:
    driver: bridge
    name: dekat-edge
  app:
    driver: bridge
    name: dekat-app
  data:
    driver: bridge
    name: dekat-data
  observability:
    driver: bridge
    name: dekat-observability

# ──────────────────────── Volumes ────────────────────────
volumes:
  caddy_data:
    name: dekat-caddy-data
  caddy_config:
    name: dekat-caddy-config
  postgres_data:
    name: dekat-postgres-data
  redis_data:
    name: dekat-redis-data
  kafka_data:
    name: dekat-kafka-data
  minio_data:
    name: dekat-minio-data
  prometheus_data:
    name: dekat-prometheus-data
  loki_data:
    name: dekat-loki-data
  tempo_data:
    name: dekat-tempo-data
  grafana_data:
    name: dekat-grafana-data
