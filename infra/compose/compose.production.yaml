name: dekat

services:
  caddy:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
      replicas: 2
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  web-public:
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
      replicas: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  web-provider:
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
      replicas: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  web-admin:
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
      replicas: 2
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  api-blue:
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=${API_JAVA_OPTS:--Xms1g -Xmx2g -XX:+UseG1GC -XX:MaxGCPauseMillis=200}
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"

  api-green:
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=${API_JAVA_OPTS:--Xms1g -Xmx2g -XX:+UseG1GC -XX:MaxGCPauseMillis=200}
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"

  worker:
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=${WORKER_JAVA_OPTS:--Xms1g -Xmx2g -XX:+UseG1GC}
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"

  postgres:
    restart: always
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  pgbouncer:
    restart: always
    environment:
      - DEFAULT_POOL_SIZE=${PGBOUNCER_POOL_SIZE:-50}
      - MAX_CLIENT_CONN=${PGBOUNCER_MAX_CLIENT_CONN:-500}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  redis:
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  kafka:
    restart: always
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  object-storage:
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  alloy:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  prometheus:
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"

  loki:
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"

  tempo:
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"

  grafana:
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SECURITY_STRICT_TRANSPORT_SECURITY=true
      - GF_SERVER_ENFORCE_DOMAIN=true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
