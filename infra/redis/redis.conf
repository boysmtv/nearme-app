# DEKAT Booking Platform - Redis 8.2 Configuration

# --- Network ---
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 300
tcp-keepalive 300

# --- Authentication ---
requirepass dekat123

# --- Memory Management ---
maxmemory 2gb
maxmemory-policy allkeys-lru
maxmemory-samples 10

# --- Persistence - RDB Snapshots ---
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# --- Persistence - AOF ---
appendonly yes
appendfilename appendonly.aof
appenddirname appendonlydir
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-use-rdb-preamble yes
aof-timestamp-enabled no

# --- Logging ---
loglevel notice
logfile ""
syslog-enabled no

# --- Slow Log ---
slowlog-log-slower-than 10000
slowlog-max-len 128

# --- Clients ---
maxclients 10000

# --- Latency Tracking ---
latency-tracking yes
latency-tracking-info-percentiles 50 99 99.9
