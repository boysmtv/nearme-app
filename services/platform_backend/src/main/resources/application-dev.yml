# ===== Dev Profile =====
spring:
  mail:
    host: localhost
    port: 1025
  datasource:
    url: jdbc:postgresql://localhost:5432/dekat_dev
    username: dekat
    password: dekat_secret
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: dekat-dev
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: id.dekat.*

# ===== Logging =====
logging:
  level:
    id.dekat: DEBUG
    org.springframework.modulith: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.kafka: DEBUG

# ===== JWT (dev) =====
jwt:
  access-secret: "DEKAT-AccessSecret-Key-AtLeast32Chars-Long-2026!"
  refresh-secret: "DEKAT-RefreshSecret-Key-AtLeast32Chars-Long-2026!"
  access-token-validity-ms: 900000
  refresh-token-validity-ms: 604800000

# ===== CORS + File upload (dev) =====
dekat:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:8081,http://10.0.2.2:8080
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: '*'
    allow-credentials: true
    max-age: 3600
  storage:
    base-path: ./uploads
    allowed-types: image/jpeg,image/png,image/webp,application/pdf
    max-size: 10MB
  notification:
    smtp:
      host: localhost
      port: 1025
      from: no-reply@dekat.id

# ===== Actuator (dev) =====
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,beans,mappings,configprops,auditevents
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false

# ===== OpenAPI (dev) =====
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

