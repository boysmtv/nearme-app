spring:
  application:
    name: dekat-platform-backend
  profiles:
    active: dev

  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 25
          fetch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  kafka:
    listener:
      ack-mode: manual
      concurrency: 3
    producer:
      acks: all
      retries: 3
      properties:
        spring.json.add.type.headers: false
        spring.json.trusted.packages: id.dekat.*
    consumer:
      auto-offset-reset: latest

  data:
    redis:
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  cache:
    type: redis
    cache-names: categories,providers,provider-services,provider-reviews,provider-staff
    redis:
      time-to-live: 600000
      cache-null-values: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

server:
  port: 8080
  servlet:
    context-path: /api/v1
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/plain,text/html
    min-response-size: 1024
  http2:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,auditevents
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

# ===== Payment Gateway =====
dekat:
  payment:
    gateway:
      provider: midtrans
      server-key: ${MIDTRANS_SERVER_KEY:SB-Mid-server-XXXXXXXXXXXXXXXXXXXX}
      webhook-secret: ${MIDTRANS_WEBHOOK_SECRET:SB-Mid-signature-key-XXXXXXXXXXXXXXXXXXXX}
      api-url: ${MIDTRANS_API_URL:https://api.sandbox.midtrans.com}

# Modulith Slices visualisation
spring.modulith:
  fail-on-missing-structure: true
  assert-mode: DETAIL
  documentation:
    group-definitions:
      - name: identity
        packages: id.dekat.identity
      - name: tenant
        packages: id.dekat.tenant
      - name: catalog
        packages: id.dekat.catalog
      - name: booking
        packages: id.dekat.booking
      - name: payment
        packages: id.dekat.payment
      - name: notification
        packages: id.dekat.notification
