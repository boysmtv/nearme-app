<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body style="font-family:Arial,sans-serif;max-width:600px;margin:0 auto;padding:20px;">
<div style="background:#6C63FF;color:white;padding:20px;border-radius:8px 8px 0 0;text-align:center;">
<h1 style="margin:0;font-size:24px;">DEKAT</h1>
</div>
<div style="background:#f8f9fa;padding:30px;border:1px solid #e9ecef;border-radius:0 0 8px 8px;">
<h2 style="color:#333;">Kode Verifikasi Anda</h2>
<p style="color:#666;">Gunakan kode berikut untuk {{purpose}}:</p>
<div style="background:white;border:2px dashed #6C63FF;border-radius:8px;padding:20px;text-align:center;margin:20px 0;">
<span style="font-size:32px;font-weight:bold;color:#6C63FF;letter-spacing:8px;">{{otpCode}}</span>
</div>
<p style="color:#999;font-size:14px;">Kode ini berlaku selama {{expiryMinutes}} menit. Jangan bagikan kode ini kepada siapapun.</p>
<hr style="border:none;border-top:1px solid #e9ecef;margin:20px 0;">
<p style="color:#999;font-size:12px;">Email ini dikirim oleh DEKAT Platform. Jika Anda tidak meminta kode ini, abaikan email ini.</p>
</div>
</body>
</html>
