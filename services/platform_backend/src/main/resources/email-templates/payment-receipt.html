<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{font-family:Arial,sans-serif;max-width:600px;margin:0 auto;padding:20px}.header{background:#4CAF50;color:white;padding:20px;text-align:center;border-radius:8px 8px 0 0}.content{padding:20px;border:1px solid #eee;border-radius:0 0 8px 8px}.detail{margin:10px 0;padding:10px;background:#f9f9f9;border-radius:4px}.footer{margin-top:20px;font-size:12px;color:#888;text-align:center}</style></head>
<body><div class="header"><h1>Payment Receipt</h1></div><div class="content"><p>Hai <strong>{{customerName}}</strong>,</p><p>Pembayaran kamu sudah diterima.</p><div class="detail"><p><strong>Kode Booking:</strong> {{bookingCode}}</p><p><strong>Jumlah:</strong> Rp {{amount}}</p><p><strong>Metode:</strong> {{paymentMethod}}</p><p><strong>Tanggal:</strong> {{paymentDate}}</p><p><strong>Reference:</strong> {{referenceId}}</p></div></div><div class="footer"><p>DEKAT - Platform Booking Layanan Lokal</p></div></body></html>
