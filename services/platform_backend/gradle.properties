# ===== Project =====
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# ===== Java =====
sourceCompatibility=25
targetCompatibility=25

# ===== Spring Boot =====
spring.application.name=dekat-platform-backend

# ===== Spring Modulith =====
spring.modulith.fail-on-missing-structure=true
spring.modulith.assert-mode=DETAIL
spring.modulith.mapped-superclass-packages=id.dekat.sharedkernel

# ===== Database =====
spring.datasource.url=jdbc:postgresql://localhost:5432/dekat
spring.datasource.username=dekat
spring.datasource.password=dekat_secret
spring.jpa.hibernate.ddl-auto=validate

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===== Redis =====
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ===== Kafka =====
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ===== OpenAPI =====
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized

# ===== Logging =====
logging.level.id.dekat=INFO
logging.level.org.springframework.modulith=INFO
