name: flutter_design_system
description: Design system package for DEKAT Booking Platform mobile apps
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.44.7'

dependencies:
  flutter:
    sdk: flutter

  # Core
  flutter_core:
    path: ../flutter_core

  # Design Tokens / Styling
  flex_color_scheme: ^8.1.0
  google_fonts: ^6.2.1

  # UI Components
  flutter_svg: ^2.0.16
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_rating_bar: ^4.0.1
  badges: ^3.1.2
  flutter_staggered_animations: ^1.1.1

  # Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
