name: flutter_api_client
description: API client package for DEKAT Booking Platform mobile apps
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.44.7'

dependencies:
  flutter:
    sdk: flutter

  # Core
  flutter_core:
    path: ../flutter_core

  # Networking
  dio: ^5.7.0
  dio_smart_retry: ^6.0.0
  connectivity_plus: ^6.1.0

  # Serialization
  json_annotation: ^4.9.0

  # Secure Storage
  flutter_secure_storage: ^9.2.4

  # Push Notifications
  firebase_messaging: ^15.1.6

  # Utilities
  dartz: ^0.10.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true
