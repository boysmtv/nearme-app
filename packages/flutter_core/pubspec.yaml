name: flutter_core
description: Core shared package for DEKAT Booking Platform mobile apps
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.44.7'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Networking
  dio: ^5.7.0
  dio_smart_retry: ^6.0.0

  # Serialization / Immutable Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Secure Storage
  flutter_secure_storage: ^9.2.4

  # Push Notifications
  firebase_messaging: ^15.1.6

  # Local Storage
  shared_preferences: ^2.3.3
  hive_flutter: ^1.0.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  equatable: ^2.0.7
  dartz: ^0.10.1

  # UI Utilities
  flutter_cache_manager: ^3.4.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.2
  mockito: ^5.4.4

flutter:
  uses-material-design: true
